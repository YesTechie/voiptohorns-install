map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP: certificate download (no warning) + send everything else to HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /ca.crt {
        alias /etc/nginx/ssl/vth.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="yestechie-vth.crt"';
    }
    location = /ca.mobileconfig {
        alias /etc/nginx/ssl/vth.mobileconfig;
        default_type application/x-apple-aspen-config;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/vth.crt;
    ssl_certificate_key /etc/nginx/ssl/vth.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /ca.crt {
        alias /etc/nginx/ssl/vth.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="yestechie-vth.crt"';
    }
    location = /ca.mobileconfig {
        alias /etc/nginx/ssl/vth.mobileconfig;
        default_type application/x-apple-aspen-config;
    }
    location /ws/ptt {
        proxy_pass http://127.0.0.1:5051;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
